server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webmvc:
          routes:

            - id: customer-service
              uri: lb://customer-service
              predicates:
                - Path=/api/customers,/api/customers/**,/api/auth/**

            - id: restaurant-service
              uri: lb://restaurant-service
              predicates:
                - Path=/api/restaurants,/api/restaurants/**

            - id: restaurant-service-menu
              uri: lb://restaurant-service
              predicates:
                - Path=/api/menu-items,/api/menu-items/**

            - id: order-service
              uri: lb://order-service
              predicates:
                - Path=/api/orders,/api/orders/**

            - id: delivery-service
              uri: lb://delivery-service
              predicates:
                - Path=/api/deliveries,/api/deliveries/**

eureka:
  client:
    service-url:
      defaultZone: http://discovery-service:8761/eureka
