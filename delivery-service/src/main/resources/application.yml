server:
  port: 8084

spring:
  application:
    name: delivery-service
  datasource:
    url: jdbc:postgresql://postgres:5432/delivery_db
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  rabbitmq:
    host: rabbitmq
    port: 5672

eureka:
  client:
    service-url:
      defaultZone: http://discovery-service:8761/eureka
